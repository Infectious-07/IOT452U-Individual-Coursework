[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital_id"
version = "1.0.0"
description = "Console backend for managing federated Digital IDs"
requires-python = ">=3.14"
authors = [{ name = "Divit Kothari" }]
readme = "README.md"
dependencies = [
    "questionary>=2.0",
    "rich>=13.7",
]

[project.scripts]
digital-id = "app:run"

[tool.setuptools]
py-modules = ["app", "config", "database", "models", "portals", "services", "shell"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
]
